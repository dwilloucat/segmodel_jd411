[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dwilloucat-segmodel_jd411"
version = "0.1.0"
description = "从输入中抽取数值，计算图像分割研究员·混合检索的权重调节相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "dwilloucat" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://dwilloucat.github.io"
Repository = "https://github.com/dwilloucat/segmodel_jd411"
Issues = "https://github.com/dwilloucat/segmodel_jd411/issues"

[project.scripts]
segmodel_jd411 = "segmodel_jd411:main"

[tool.setuptools]
py-modules = ["segmodel_jd411"]
